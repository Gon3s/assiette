name: assiette
description: "Food · symptoms · environment. Connect the dots."
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.8
  # Base locale (SQLite)
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  flutter:
    sdk: flutter
  # Notifications locales
  flutter_local_notifications: ^22.0.0
  flutter_localizations:
