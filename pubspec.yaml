name: assiette
description: "Food · symptoms · environment. Connect the dots."
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.8'

dependencies:
  # Sauvegarde/restauration cloud (US-26)
  archive: ^4.0.7
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  # Base locale (SQLite)
  drift: ^2.35.2
  drift_flutter: ^0.3.0
  # Graphiques température/pression (bottom sheet météo)
  fl_chart: ^1.1.0
  flutter:
    sdk: flutter
  # Notifications locales
  flutter_local_notifications: ^22.0.0
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.3.1
  flutter_timezone: ^4.1.1
  freezed_annotation: ^3.1.0
  # Reverse geocoding (nom du lieu depuis lat/lon)
  geocoding: ^4.0.0
  # Localisation & météo (Open-Meteo)
  geolocator: ^14.0.2
  go_router: ^17.3.0
  # Typographie Rubik (refonte design)
  google_fonts: ^6.3.0
  # Auth Google Drive (US-26, sauvegarde cloud)
  google_sign_in: ^7.2.0
  # API Google Drive (US-26, sauvegarde cloud)
  googleapis: ^15.0.0
  # Appel API Open-Meteo
  http: ^1.6.0
  # Formatage dates (version épinglée par flutter_localizations)
  intl: any
  json_annotation: ^4.12.0
  path: ^1.9.0
  path_provider: ^2.1.5
  # Export PDF (US-17)
  pdf: ^3.12.0
  printing: ^5.14.3
  riverpod_annotation: ^4.0.2
  share_plus: ^13.1.0
  timezone: ^0.11.0
  uuid: ^4.5.3
  # Tâches de fond
  workmanager: ^0.9.0

dev_dependencies:
  # Analyzer 14 support; Riverpod currently keeps the graph on build 4.
  build_runner: ^2.16.2
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.3
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true

# Splash screen natif (dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#020F2E"
  image: assets/splash/splash_logo.png
  # Android 12+ : masque circulaire système, le texte serait coupé — logo seul
  android_12:
    color: "#020F2E"
    image: android/app/src/main/play_store_512.png
