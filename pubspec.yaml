name: assiette
description: "Food · symptoms · environment. Connect the dots."
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  # Base locale (SQLite)
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  flutter:
    sdk: flutter
  # Notifications locales
  flutter_local_notifications: ^22.0.0
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.3.1
  flutter_timezone: ^4.1.1
  freezed_annotation: ^3.1.0
  # Localisation & météo (Open-Meteo)
  geolocator: ^14.0.2
  go_router: ^17.3.0
  # Typographie Rubik (refonte design)
  google_fonts: ^6.3.0
  # Suggestion de tags depuis photo (US-19), modèle on-device
  google_mlkit_image_labeling: ^0.15.0
  # Appel API Open-Meteo
  http: ^1.6.0
  # Photo
  image_picker: ^1.2.2
  # Formatage dates (version épinglée par flutter_localizations)
  intl: any
  json_annotation: ^4.12.0
  path: ^1.9.0
  path_provider: ^2.1.5
  # Export PDF (US-17)
  pdf: ^3.12.0
  permission_handler: ^12.0.3
  printing: ^5.14.3
  riverpod_annotation: ^4.0.2
  share_plus: ^13.1.0
  timezone: ^0.11.0
  uuid: ^4.5.3
  # Tâches de fond
  workmanager: ^0.9.0

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.3
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true

# Splash screen natif (dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#020F2E"
  image: assets/splash/splash_logo.png
  # Android 12+ : masque circulaire système, le texte serait coupé — logo seul
  android_12:
    color: "#020F2E"
    image: android/app/src/main/play_store_512.png
