name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK (dev flavor)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # flutter analyze exits non-zero on info-level lints
      # (public_member_api_docs is tolerated in this project), so the APK
      # workflow only gates on tests.
      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug -t lib/main_dev.dart

      - name: Publish debug APK to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "Dev build (latest)"
          prerelease: true
          body: >-
            APK de debug (flavor dev) généré automatiquement depuis le
            commit ${{ github.sha }} sur `main`. Cette release est mise à
            jour à chaque push.
          files: build/app/outputs/flutter-apk/app-debug.apk
