version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      dart-patches:
        patterns:
          - archive
          - collection
          - freezed_annotation
          - http
          - intl
          - json_annotation
          - mocktail
          - path
          - timezone
          - uuid
        update-types: [patch]

  # Native plugins and every Gradle/Actions update require manual review.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: '07:15'
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    groups:
      android-toolchain:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
